# Status flag policy.
# Codes are the SDMX observation-status codes. pipeline/flags.py
# applies this file to every parser's output; no parser sets a final flag itself.
#
# precedence: when several rules apply to one observation, the code listed first wins.
# class_flags: the flag each origin class (series_catalog.yaml `origin` segments) implies.
#   derived: inherit = the highest-precedence flag among the same-period rows of its `inputs`.
# default_windows: the latest N periods of a series are provisional (P), counted on the series'
#   own latest period in the table, never on the run date. 0 = never provisional.
# series: per-series window (an integer, or `publisher` = only the source file's own marking)
#   with the reason. Series not listed use the default for their frequency.
precedence: [M, B, E, U, P, A]

class_flags:
  observed: A
  derived: inherit
  modelled: E
  transcribed: U   # until the source document is archived
  unknown: U

default_windows: {daily: 0, monthly: 12, quarterly: 4, annual: 2}

# breaks: the first period measured on a changed definition (status B), from the source's own footnote.
#   status: proposed = read from the footnote and not yet confirmed by the maintainer: it is not applied
#                       (the maintainer confirmed all seven entries below on 2026-10-28).
#           confirmed = applied by pipeline/flags.py, so the period is flagged B and the jump gate reports
#                       a move there as [BREAK] instead of a review notice.
#   To confirm, change the status and run `python pipeline/run_parsers.py` (a flag change is updated in place).
breaks:
  # CBI Key Financial Indicators (cbi.iq/news/view/94), notes under the table
  - series: money.m0
    period: 2007-07
    status: confirmed
    source: KFI note 1
    note: From July 1, 2007 the ID overnight deposits were replaced with 7 day deposits, and thus no longer included in base Money and Excess Reserves.
  - series: money.reserves_official
    period: 2006-01
    status: confirmed
    source: KFI note 9 (on Investments, a part of the official reserve)
    note: Investment data were amended as of Jan.2006, based on the CBI balance sheet. (May be a revision of earlier months, not a break.)
  - series: money.reserves_official
    period: 2009-10
    status: confirmed
    source: KFI note 5 (on Gold and SDRs, a part of the official reserve)
    note: Starting from October 2009, the increasing in SDR is according to the IMF revised treatment of SDR Allocations in Monetary Statistics.
  - series: money.reserves_official
    period: 2015-11
    status: confirmed
    source: KFI note 5 (on Gold and SDRs, a part of the official reserve)
    note: Excluding SDR starting frome Nov. 2015  # sic: the workbook's own spelling and no full stop
  - series: money.required_reserves
    period: 2005-05
    status: confirmed
    source: KFI note 3
    note: 25% of the Reservable Deposits included the government Deposits Since May 2005
  - series: money.required_reserves
    period: 2007-07
    status: confirmed
    source: KFI note 3
    note: then became 75% of Reservable Gov. Deposits since July,2007
  - series: money.required_reserves
    period: 2009-03
    status: confirmed
    source: KFI note 3
    note: So 25% of the Reservable Deposits included the government Deposits Since March 2009.

