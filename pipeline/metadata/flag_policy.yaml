  cpi.headline_2007: {revision_window: 0, rationale: Base superseded and no longer revised (update_schedule.yaml ended)}
  cpi.headline_2012: {revision_window: 0, rationale: Base superseded and no longer revised (update_schedule.yaml ended)}
