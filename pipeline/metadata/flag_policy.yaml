  cpi.core_1993: {revision_window: 0, rationale: Base superseded and no longer revised (update_schedule.yaml ended)}
  cpi.core_2007: {revision_window: 0, rationale: Base superseded and no longer revised (update_schedule.yaml ended)}
  cpi.core_2012: {revision_window: 0, rationale: Base superseded and no longer revised (update_schedule.yaml ended)}
  cpi.core_2022: {revision_window: 12, rationale: Default; COSIT revision practice not documented (confirmed by the maintainer, 2026-10-25)}
  cpi_headline: {revision_window: 12, rationale: Default; COSIT revision practice not documented (confirmed by the maintainer, 2026-10-25)}
  cpi_core: {revision_window: 12, rationale: Default; COSIT revision practice not documented (confirmed by the maintainer, 2026-10-25)}
  # Oil
  crude_production_secondary: {revision_window: 12, rationale: EIA revises recent months in each release cycle}
  crude_production_direct: {revision_window: 12, rationale: Monthly default; JODI and OPEC MOMR revise recent months}
