  gdp.real_nonoil: {revision_window: 8, rationale: COSIT revised quarterly GDP for at least a year after its first figure}
  # CBI fiscal bulletin marks outturns provisional pending final accounts; the seed years are U
  fiscal.revenue_total: {revision_window: publisher, rationale: CBI bulletin marks outturns provisional pending final accounts}
  fiscal.revenue_current: {revision_window: publisher, rationale: CBI bulletin marks outturns provisional pending final accounts}
