# Terms of reuse, one record per source.
# Raw manifest entries (`source_ref`) and catalog origin segments (`origin[].source_ref`) refer to
# these ids; docs/source_inventory.md ("Terms of reuse by source") and datapackage.json `sources`
# are generated from this file.
#
#   id              unique, lowercase with `_`
#   publisher       the original publisher
#   title           the product (file, database or API) read
#   url             where it is published
#   terms           the publisher's words, or exactly "No licence stated"
#   licence         an SPDX id, only when `status: licensed`; otherwise null
#   status          licensed | no_licence_stated | confirmed_by_maintainer | unconfirmed
#                   (`unconfirmed` = the terms have not been checked at the publisher yet; an open
#                   item, listed in docs/source_inventory.md)
#   redistribution  the basis on which the project republishes the data
#   attribution     the credit to give
#   checked         the date the terms were last checked (for `unconfirmed`, the date this record
#                   was written)
