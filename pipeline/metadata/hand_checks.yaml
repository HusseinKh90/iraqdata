# Hand-checked values.
# Each `expected` was read independently from the cited location of the archived file (openpyxl
# with data_only=True, csv, json or zipfile; never through the parser), multiplied by `scale`
# and, where the parser rounds, rounded to `round` decimals. tests/test_parser_hand_checks.py
# re-reads every location and compares it with the parser's sandbox output.
#
# status: pending                    - read from the archived file; awaiting the maintainer's
#                                      check against the published document
#         confirmed                  - checked by the maintainer on `confirmed_on` (YYYY-MM-DD)
#         unverified-against-source  - cosit_gdp only: the values are typed in from COSIT
#                                      documents. Two read the transcription
#                                      record (a round-trip check, not a check against the
#                                      publisher); one pins a derived value. Where a row cites an
#                                      archived document, pipeline/check_cosit_record.py reads
#                                      it back from that document.
