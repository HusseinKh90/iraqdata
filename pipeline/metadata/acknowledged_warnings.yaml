# Acknowledged gatekeeper warnings.
#
# A Tier 2 warning that reflects a genuine movement in the published source data (not a data or
# processing error) is reviewed and recorded here. `python pipeline/validate.py` then reports it as
# [ACKNOWLEDGED] instead of a review notice, and `--release` passes.
#
# Fields:
#   series    - series_id the warning is about (or `sanity` - a sanity check id, with check: sanity)
#   check     - envelope | sign | jump | scale_shift | unfinished_period | unchecked_series |
#               overdue | gap | sanity
#   periods   - the warning periods this entry covers; one entry can cover an event's several
#               periods, each matched on its own
#   values    - {period: value} as reviewed, for envelope, sign, jump, scale_shift and sanity:
#               every listed period, and for a jump also the value before it. If a published value
#               changes (a revision), the entry no longer applies and is reported [CHANGED]
#               (values are compared at 10 significant figures)
#   dataset   - optional file name (e.g. oil_monthly.parquet); omitted, the entry covers the
#               production table and its seed snapshot
#   reason    - the event or decision that explains the value (required)
#   reviewer  - who reviewed it (required)
#   date      - YYYY-MM-DD, when it was reviewed (required)
#   review_by - YYYY-MM-DD (required): at most 12 months after `date`, or at most 5 years for
#               settled history. Past it the entry no longer applies and is reported [EXPIRED],
#               and `--release` fails; within 30 days of it the entry is [DUE-FOR-REVIEW]
#   settled   - optional, true for a past event whose values are final (allows the 5 years)
#
# `python pipeline/validate.py --propose-acknowledgements FILE` drafts entries, with the values
# filled in, for every unacknowledged notice. An entry that no longer matches any warning is
# reported as [STALE] and fails `--release`, so remove it when the underlying data changes.

