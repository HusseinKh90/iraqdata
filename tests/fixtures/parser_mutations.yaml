# Robustness mutations.
#
# spreadsheet: the 6 parsers that read a workbook by sheet name, row label or cell position.
#   input        - the one representative workbook that is mutated (manifest path)
#   sheets       - the sheets the parser reads: a blank row is inserted above the first used
#                  row of each (row_inserted), and each is renamed with "_x" (sheet_renamed)
#   label        - one label cell the parser relies on, rewritten to `new_text` (label_changed)
#   label_words  - words that, in an error message, name the sheet or label (clear_error)
#
# bad_input: the primary input of all 11 parsers, replaced by a missing, an empty (0 bytes)
#   and a corrupt (random bytes, same length and extension) copy.

spreadsheet:
  cbi_bop:
    input: pipeline/raw/cbi/bop/bop_2024.xlsx
    sheets: ["BOP Q1 ", "BOP Q2", "BOP Q3", "BOP Q4"]
    label: {sheet: "BOP Q4", cell: A9, new_text: "Current account balance"}
    label_words: ["bop q", "current account"]
  cbi_cpi:
    input: pipeline/raw/cbi/key_financial_indicators.xlsx
    sheets: ["Sheet1"]
    label: {sheet: "Sheet1", cell: B9, new_text: "Consumer prices, new base"}
    label_words: ["sheet1", "consumer price index"]
  cbi_exchange_rates:
    input: pipeline/seeds/cbi_exchange_rate_historical.xlsx
    sheets: ["Daily Market price", "Daily Price basis"]
    label: {sheet: "Daily Price basis", cell: A410, new_text: "Year 15 / Date"}
    label_words: ["daily market price", "daily price basis", "2015"]
  fiscal_seed:
    input: pipeline/seeds/iraq_fiscal_historical.xlsx
    sheets: ["Sheet1"]
    label: {sheet: "Sheet1", cell: B1, new_text: "revenue total"}
    label_words: ["revenue_actual_total", "year", "sheet1"]
  cbi_fiscal_bulletin:
    input: pipeline/raw/cbi/bulletin_latest.xlsx
    sheets: ["6-1"]
    label: {sheet: "6-1", cell: A41, new_text: "Year total"}
    label_words: ["6-1", "dec"]
  cbi_money_banking:
    input: pipeline/raw/cbi/key_financial_indicators.xlsx
    sheets: ["Sheet1"]
    label: {sheet: "Sheet1", cell: B110, new_text: "Broad money"}
    label_words: ["sheet1", "m2", "indicator"]

bad_input:
  bis_lbs: pipeline/raw/bis/bis_lbs_claims_total.csv
  cbi_bop: pipeline/raw/cbi/bop/bop_2024.xlsx
  cbi_cpi: pipeline/raw/cbi/key_financial_indicators.xlsx
  cbi_exchange_rates: pipeline/seeds/cbi_exchange_rate_historical.xlsx
  fiscal_seed: pipeline/seeds/iraq_fiscal_historical.xlsx
  cbi_fiscal_bulletin: pipeline/raw/cbi/bulletin_latest.xlsx
  cbi_money_banking: pipeline/raw/cbi/key_financial_indicators.xlsx
  cosit_gdp: pipeline/raw/transcribed/cosit_gdp_quarterly_2026-10-28.csv  # the record it reads
  oecd_dac: pipeline/raw/oecd/wb_oda_net.json
  oil_daily: pipeline/raw/fred/DCOILBRENTEU.csv
  oil_monthly: pipeline/raw/eia/INTL.zip
