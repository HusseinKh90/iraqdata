  source_file: pipeline/raw/cbi/key_financial_indicators.xlsx (Rows 4, 6, 8, 10)
  cross_check: COSIT CPI Historical Bulletins
  description: Continuous monthly core consumer price index linked by iraqdata from the
    1993, 2007, 2012 and 2022 native core series (not a series published by COSIT or the CBI), by the
    same December one-month overlap as cpi_headline, with status flag B on every switch month.
    The core definition changes at the 1993 to 2007 switch - the 1993 base excludes fuel and
    lighting and transport and communications, the later bases exclude fruit and vegetables and
    kerosene and LPG - so values before and after it measure different core baskets. "2022 = 100"
    is approximate; details in docs/linked_inflation_method.md.
