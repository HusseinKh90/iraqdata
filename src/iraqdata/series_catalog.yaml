    source_ref: cbi_fx
- series_id: crude_production_secondary
  name_en: Crude Oil Production (Secondary Sources)
  name_ar: إنتاج النفط الخام (المصادر الثانوية)
  category: oil
  frequency: monthly
  unit: TB_PER_D
  start_date: 2004-01
  primary_source: U.S. EIA International Energy Statistics (INTL.57-1-IRQ-TBPD.M)
  source_file: pipeline/raw/eia/INTL.zip
  cross_check: JODI-Oil (INDPROD, 2007-Mar 2024)
  description: Monthly crude oil production of Iraq as estimated by the U.S. EIA from secondary
    sources (independent tracking of output and shipments), read from the EIA International
    Energy Statistics bulk file, series INTL.57-1-IRQ-TBPD.M. Not the OPEC MOMR secondary-sources
    table, which is not read.
  summary: 'Iraq crude production estimated by secondary sources (U.S. EIA International Energy Statistics).'
  origin:
  - from: 2004-01
    to: open
    class: observed
    official: true
    method: Read from the U.S. EIA International Energy Data archive (INTL.57-1-IRQ-TBPD.M)
    source: U.S. EIA International Energy Statistics (INTL.57-1-IRQ-TBPD.M)
    source_ref: eia_intl
- series_id: crude_production_direct
  name_en: Crude Oil Production (Direct Communication)
  name_ar: إنتاج النفط الخام (الاتصال المباشر - وزارة النفط)
  category: oil
  frequency: monthly
  unit: TB_PER_D
  start_date: 2007-01
  primary_source: JODI-Oil (INDPROD, 2007-Mar 2024); OPEC MOMR Direct Communication
    (Apr 2024+)
  source_file: pipeline/raw/jodi/jodi_iraq_<year>.csv (2007-01 to 2024-03) & pipeline/raw/transcribed/opec_momr_crude_direct_2026-10-25.csv
    (2024-04 on)
  cross_check: None
  description: 'Monthly crude oil production reported by the Iraqi Ministry of Oil through direct
    communication: read from the JODI-Oil database to March 2024, then typed in from OPEC Monthly
    Oil Market Report figures whose source documents are not archived (status flag U).'
  summary: 'Iraq crude production reported by the Ministry of Oil: read from JODI to March 2024, then typed in from OPEC MOMR figures (flag `U`).'
  origin:
  - from: 2007-01
    to: 2024-03
    class: observed
    official: true
    method: Read from the JODI-Oil World Database annual files (INDPROD, CRUDEOIL, KBD)
    source: JODI-Oil World Database (pipeline/raw/jodi/jodi_iraq_<year>.csv)
    source_ref: jodi_oil
  - from: 2024-04
    to: open
    class: transcribed
    official: true
    method: Typed in from OPEC Monthly Oil Market Report direct-communication figures; source document not
      archived
    source: OPEC Monthly Oil Market Report (issue and table not recorded)
    source_ref: opec_momr
    record: pipeline/raw/transcribed/opec_momr_crude_direct_2026-10-25.csv
- series_id: oil_price_basrah
  name_en: Basrah crude price, OPEC MOMR anchor months (transcribed)
  name_ar: معدل سعر نفط البصرة (خام البصرة الخفيف / المتوسط)
  category: oil
  frequency: monthly
  unit: USD_PER_BBL
  start_date: 2004-07
  primary_source: OPEC Monthly Oil Market Report (MOMR - OPEC Reference Basket)
  source_file: pipeline/raw/transcribed/opec_momr_basrah_anchors_2026-10-25.csv
  cross_check: None
  description: Ten monthly prices typed in from OPEC Monthly Oil Market Reports (issue not recorded).
    The other months are left empty on purpose, because a price estimated as the Brent monthly
    mean minus a fixed discount would not be a Basrah price.
  summary: 'Basrah crude price, OPEC MOMR anchor months only: ten prices typed in from OPEC reports (flag `U`). The other months are not estimated.'
  origin:
  - from: 2004-07
    to: open
    class: transcribed
    official: true
    method: Ten anchor months typed in from OPEC Monthly Oil Market Reports; source documents not archived
    source: OPEC Monthly Oil Market Report (issues not recorded)
    source_ref: opec_momr
    record: pipeline/raw/transcribed/opec_momr_basrah_anchors_2026-10-25.csv
