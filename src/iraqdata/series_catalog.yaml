- series_id: cpi_headline
  name_en: Consumer Price Index (Headline, Linked Series, 2022 = 100)
  name_ar: الرقم القياسي العام لأسعار المستهلك (سلسلة مترابطة، 2022 = 100)
  category: prices
  frequency: monthly
  unit: INDEX
  start_date: 2004-01
  primary_source: Central Bank of Iraq & COSIT
  source_file: pipeline/raw/cbi/key_financial_indicators.xlsx (Rows 3, 5, 7, 9)
  cross_check: COSIT CPI Historical Bulletins
  description: Continuous monthly headline consumer price index linked by iraqdata from the
    1993, 2007, 2012 and 2022 native base series (not a series published by COSIT or the CBI). Each
    older base is used through December of its overlap year and the series switches base the
    following January, linking at that December (a December one-month overlap); every switch
    month carries status flag B. On the 2022 base's scale without rescaling, so "2022 = 100" is
    approximate (the linked 2022 average is not exactly 100). Factors, splice months and the
    remaining year-on-year gaps are in docs/linked_inflation_method.md.
