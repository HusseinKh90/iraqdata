    status flag B; the BIS publishes a comparable pre-break value for them, which is not
    included here.
  summary: 'Total cross-border claims of BIS reporting banks on Iraqi counterparties.'
  origin:
  - from: 2004-Q1
    to: open
    class: observed
    official: true
    method: Read from the archived source file named in source_file
    source: Bank for International Settlements (BIS)
    source_ref: bis_lbs
