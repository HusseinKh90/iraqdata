- series_id: bis.lbs.net_position
  name_en: Iraq's Net Position vis-à-vis BIS Reporting Banks (Liabilities minus Claims)
  name_ar: صافي مركز العراق تجاه المصارف المبلِّغة لبنك التسويات الدولية (الالتزامات ناقص المطالبات)
  category: bis
  frequency: quarterly
  unit: MILLION_USD
  start_date: 2004-Q1
  primary_source: Bank for International Settlements (BIS)
  source_file: BIS Locational Banking Statistics (LBS_PUB / WS_LBS_D_PUB)
  cross_check: 'Accounting identity: bis.lbs.liabilities_total - bis.lbs.claims_total'
  description: Liabilities of BIS reporting banks to Iraqi residents minus their claims on
    Iraqi residents, measured from the reporting banks' books (cross-border positions, all
    reporting countries, all sectors and instruments). It is Iraq's position against those
    banks; a positive value means Iraqi residents hold more with BIS reporting banks (deposits
    and other claims) than they owe them, so Iraq is a net creditor of the reporting banks.
    It covers banks only and is not the international investment position or Iraq's total
    net external assets.
    Quarters where either input is a BIS break carry status flag B.
  summary: 'Iraq''s net position against BIS reporting banks: their liabilities to Iraqi residents minus their claims on Iraqi residents. Positive means Iraq is a net creditor of the reporting banks. Cross-border bank positions only; not the international investment position.'
  origin:
  - from: 2004-Q1
    to: open
    class: derived
    official: true
    method: Computed as liabilities_total minus claims_total
    source: Bank for International Settlements (BIS)
    inputs:
    - bis.lbs.liabilities_total
    - bis.lbs.claims_total
