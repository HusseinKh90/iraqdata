- series_id: parallel_rate_iraq
  name_en: Parallel Market Exchange Rate (Baghdad)
  name_ar: سعر صرف السوق الموازي للدينار العراقي (بغداد)
  category: exchange_rates
  frequency: daily
  unit: IQD_PER_USD
  start_date: '2004-01-01'
  primary_source: 2004-2022 CBI published daily market rate (user-provided historical
    seed); from 2023-01-01 HusseinKh90/Iraq-parallel-exchange-rate (GitHub; publisher),
    Baghdad close, from the dealer Telegram channels @dollariraqi, @iqborsa and @dollar_price;
    licence CC-BY 4.0 (checked 2026-10-24)
  source_file: pipeline/seeds/cbi_exchange_rate_historical.xlsx (Sheet 'Daily Market
    price', to 2022-12-31) & pipeline/raw/github/daily_fx_<date>.csv (column baghdad_close,
    from 2023-01-01)
  cross_check: World Bank RTFX
  description: Daily closing parallel market exchange rate for the Iraqi Dinar per
    US Dollar in Baghdad (Al-Kifah and Al-Harithiya bourses). Headline national parallel
    rate. The source changes on 2023-01-01; that value is flagged B (series break).
  summary: 'Daily closing parallel market exchange rate in Baghdad: CBI''s published market rate to 2022, then the Baghdad close of the [Iraq-parallel-exchange-rate](https://github.com/HusseinKh90/Iraq-parallel-exchange-rate) dealer consensus (CC-BY 4.0). Flag `B` on 2023-01-01 marks the change of source.'
  origin:
  - from: '2004-01-01'
    to: '2022-12-31'
    class: observed
    official: true
    method: Read from the CBI published daily market rate (historical seed workbook, sheet 'Daily Market
      price')
    source: Central Bank of Iraq (pipeline/seeds/cbi_exchange_rate_historical.xlsx)
    source_ref: cbi_fx
  - from: '2023-01-01'
    to: open
    class: observed
    official: false
    method: Read from the Iraq-parallel-exchange-rate dataset (Baghdad close of dealer quotes)
    source: HusseinKh90/Iraq-parallel-exchange-rate dealer consensus (CC-BY 4.0)
    source_ref: iraq_parallel_fx
